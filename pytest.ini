[pytest]
# Pytest configuration for course-sdlc

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-branch

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    security: Security-focused tests
    slow: Slow-running tests
    integration: Integration tests
    unit: Unit tests

# Coverage options
[coverage:run]
source = src
omit =
    tests/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: